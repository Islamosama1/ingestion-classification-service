services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ingestion
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate test DB on first start.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d ingestion']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off: applies pending migrations, then exits. api waits for it.
  migrate:
    build: .
    image: ingestion-classification-service:local
    command:
      [
        'node',
        'node_modules/typeorm/cli.js',
        'migration:run',
        '-d',
        'dist/database/cli-data-source.js',
      ]
    environment: &app-env
      NODE_ENV: production
      PORT: 3000
      API_KEY: ${API_KEY:?set API_KEY in .env}
      CLASSIFIER_MIN_DELAY_MS: ${CLASSIFIER_MIN_DELAY_MS:-200}
      CLASSIFIER_MAX_DELAY_MS: ${CLASSIFIER_MAX_DELAY_MS:-1500}
      CLASSIFIER_FAILURE_RATE: ${CLASSIFIER_FAILURE_RATE:-0.1}
      REVIEW_THRESHOLD: ${REVIEW_THRESHOLD:-0.7}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-10}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-5}
      WORKER_RETRY_BASE_MS: ${WORKER_RETRY_BASE_MS:-2000}
      WORKER_RETRY_MAX_MS: ${WORKER_RETRY_MAX_MS:-60000}
      WORKER_STALE_LOCK_MS: ${WORKER_STALE_LOCK_MS:-60000}
      # Inside Docker the DB is reached by service name, not localhost.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ingestion
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ingestion-classification-service:local
    environment: *app-env
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Background classification. More workers: docker compose up --scale worker=3
  worker:
    image: ingestion-classification-service:local
    command: ['node', 'dist/worker/main.js']
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Lets the current round finish on docker stop.
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
